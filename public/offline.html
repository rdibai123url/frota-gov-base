<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2545" />
    <title>Sem conexão — Dibai Fleet</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f7fa; color: #0b2545; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
      main { max-width: 420px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { line-height: 1.5; color: #46546a; }
      button { margin-top: 16px; background: #0b2545; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>
        O Dibai Fleet precisa de internet para mostrar dados atualizados. Se estiver em viagem, procure
        um local com sinal e tente novamente. Os dados já
        salvos continuam preservados.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
